PACKAGE_NAME="zt9612"
PACKAGE_VERSION="0.1.0"

# 源码在 driver/ 子目录，Makefile 同时是 Kbuild 文件
# 注意：按上游 DKMS 文档，CLEAN / REMAKE_INITRD / MODULES_CONF / OBSOLETE_BY
#       都是已废弃指令，DKMS 自己会清理构建目录并处理 depmod/initramfs —— 这里不写。
MAKE="kernelver=$kernelver ./dkms-make.sh"

BUILT_MODULE_NAME[0]="zt9612"
BUILT_MODULE_LOCATION[0]="driver"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"

# 编译下限：6.12 —— 驱动 include 了 linux/unaligned.h（该头文件 6.12 才从
# asm/unaligned.h 改名而来）。CI 实测：6.17 无告警编译通过；6.8 因缺该头文件失败。
# 实机验证的内核是 7.0.0-31。
BUILD_EXCLUSIVE_KERNEL="^(6\.1[2-9]\.|[7-9]\.)"
