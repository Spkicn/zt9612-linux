#
# 安装到 /etc/modprobe.d/zt9612.conf（由 install-driver.sh 参考，不自动覆盖）
#
# 注意：开发/尝鲜阶段请保留 install-driver.sh 写入的
#       /etc/modprobe.d/zt9612-blacklist.conf —— 让本模块只在手动 modprobe 时加载。
#       原因见 README「已知问题」：曾观察到 USB modalias 自动加载后整机失联，
#       根因（注册 wiphy 时漏设父设备）已在 v0.2.0 修复，但这条完整路径尚未复验。

# ----- 模块参数（对应 driver/zt9612.c 的 module_param） ----------------------
#
# do_init : 固件装载完成后是否执行同步 IPC 初始化序列
#           1 = 执行（默认，insmod 全程约 7 秒，其中 MM_START 等约 6.5 秒）
#           0 = 只装载固件，便于分步调试
#
# do_boot : 是否下载固件
#           1 = 下载（默认；要求设备处于"刚上电/刚切模式"的干净 ROM 状态）
#           0 = 复用已经在运行的固件，只做 IPC 初始化（省掉一次拔插）
#
# scan_probe : 扫描时是否主动发送 probe request
#           0 = 只做被动扫描（默认，已验证：iw scan 能列出周围 AP）
#           1 = 每信道发送本驱动自建的广播 probe request（**尚未单独复验**）
#           2 = 逐字节重放厂商抓包里的 probe request（已验证：能收到 probe response）
#           注：1/2 都会跳过 cfg80211 标了 NO_IR/RADAR 的信道
#
# tx_ep : TX bulk-OUT 端点号（默认 5，实验开关，一般不用改）
#
# tx_prep : 切换信道前是否重放厂商的使能序列（SET_IDLE / 0x0104 / SET_FILTER）
#           1 = 重放（默认，与厂商驱动一致）；0 = 不重放（实验对比用）
#
# tx_variant : TX 帧变体实验开关（默认 0）
#           0 = 正常；1 = 描述符 +0x00 置 0；2 = 不带描述符；3 = 补齐到 512 字节
#
# rx_debug : 诊断用（默认 0）。写入 N 后，驱动会记录接下来 N 个**接收** USB 传输
#           的长度（`journalctl -k | grep rxdbg`）。原本用于查"约 1030 字节阈值"，
#           该问题已定案为**驱动 TX 侧**的帧长上限（见 CHANGELOG [0.3.2]）：接收侧正常，
#           下载采样 14095 帧里 98.9% 都 >1030 字节。现在只作 RX 帧长观测用。
#           两个坑：写参数不要用 `echo N | sudo tee`（tee 会吞掉 stdin），
#           读日志用 journalctl -k（kernel.dmesg_restrict=1 时 dmesg 直读为空）。
#
# tx_status : 实验开关（默认 0=关闭）。非 0 时把发送结果上报给 mac80211。
#           实测：上报确实进了速率控制（tx retries 从 18 涨到 6532），但
#           **速率与吞吐都不变**（速率由固件自主决定），因此默认关闭。
#
# tx_status_probe : 开启 tx_status 时，每 N 帧把 1 帧标成"已 ACK"（默认 100），
#           其余如实报失败 —— 因为 USB 写入成功不等于空口被 ACK，不能谎报。
#
# ht_cap_enable : 实验开关（默认 0=关闭）。给 5 GHz band 声明 HT（HT20/SGI、MCS0-15）。
#           **它是 A-MPDU 聚合的前提**：mac80211 的 ieee80211_aggr_check() 在对端链路
#           没有 HT 能力时直接返回（实测 kprobe：不开时 start_tx_ba_session() 永不触发；
#           开了才是 1）。单独声明 HT 不改变实测吞吐。**保持 0。**
#
# tx_desc_mask : 实验开关（默认 0=关闭）。对**加密单播数据帧**按位套用厂商数据帧的
#           描述符字段值（bit1 = `+0x08`）。实测：微基准读数暴涨（×27）但网关收不到帧、
#           DHCP 拿不到地址 ⇒ **默认必须为 0**；微基准读数不等于空口吞吐。
#
# ntf_log : 实验开关（默认 0=关闭）。打印接下来 N 条 EP2-IN 通知内容。
#           实测本设备 interface 0 只有 5 个端点（EP4-IN + EP5-8-OUT），**没有 EP2-IN**，
#           该通道恒为空；代码保留接管逻辑供将来复核。
#
# sta_add_en : 实验开关（默认 0=关闭）。关联完成后给固件发 MM_STA_ADD_REQ(0x0A)，
#           并把 CFM 返回的 sta_idx 写进**加密单播数据帧**的描述符 +0x09
#           （管理帧/广播/EAPOL 仍按"无站点"发）。动机：厂商 Windows 驱动就是这么做的，
#           同链路上传 95.3 Mbit/s，而本驱动 3.7 Mbit/s。
#           **状态（2026-10-02）**：载荷已实测被固件接受
#           （MM_STA_ADD_CFM → status=0、sta_idx=N；`dmesg | grep STA_ADD_CFM` 可见），
#           链路/DHCP/上网不受影响。但**只带 sta_idx 没带来吞吐提升**
#           （A/B：上传 0.38 vs 0.33 Mbit/s，噪声内）⇒ 默认仍为 0。
#           载荷格式由 sta_add_fmt 控制（默认 7 = 宽切除载荷，2026-10-04 转正）。
#           改载荷任何字节都要"一次一个变量"，并以 0x0B / 0x0600 为判据。
#
# tx_staidx : 实验开关（默认 1）。1 = 加密单播数据帧描述符写入 sta_idx；
#           0 = 一律走"无站点"0xff 路径（r20 重连聋隔离臂）。
#
# tx_staid4b : 实验开关（默认 0，r22）。1 = 描述符头 4 字节写成 00 staid 05 00
#           （厂商关联期 46B 形态，+0x01=staid 随 STA_ADD_CFM 演化）；
#           0 = 厂商稳态 0xffffffff。r22 首臂实测无差异。
#
# sta_del_en : 实验开关（默认 0）。1 = 断开时发 MM_STA_DEL_REQ 归还固件站点槽位；
#           0 = 保留固件会话跨重连 —— r20 实测固件对断开后的会话清理不可逆，
#           发 STA_DEL 后重连的加密单播 TX 全聋，会话复用是唯一可用的重连路径。
#
# sta_reuse : 实验开关（默认 1）。1 = 同 BSSID 会话已存在时跳过重发 MM_STA_ADD
#           （r20 验证两次重连 0% 丢包）；0 = 强制重发拿新 sta_idx
#           （r21 观测：环境劣化后同样救不回来）。
#
# sta_add_fmt : MM_STA_ADD_REQ 的 RC 块格式（默认 7，2026-10-04 r26 起转正）。
#           7 = **宽切除载荷**（fmt=5 保留速率核 + AID + BSSID，三个未知掩码块
#           +0x04..05/+0x18..0x1f/+0x24..25 清零）——r26 实证拆除"登记后 8~40s
#           定时死亡"：断开重连恢复、12 分钟浸泡零死亡、21.4 Mbit/s 洪泛 30s 全存活；
#           5 = 2026-10-02 USBPcap 厂商逐字节真载荷（r21-r25 默认，**定时死亡**，勿用）；
#           0 = legacy 模板基线；1/2 = 历史 format=2 构造（r17/r19 实测当场打死固件，勿用）；
#           3/4 = fmt0+rate_map 历史臂；6 = max-MCS 钳位臂（r25 实测死）；
#           8 = 掩码二分臂（r26）。
#
# vendor_seq_en : 实验开关（默认 0，r21）。1 = 关联后在 STA_ADD_CFM 之后补发厂商
#           配置序列（0x001a×4、0x0054、0x001e、0x0020、0x005a，载荷逐字节来自实抓）。
#
# key_en : WPA 密钥路径（默认 2，r20 定案）。2 = mac80211 软件加解密
#           （WPA2 ping 0% 丢包）；1 = 固件密钥路径（MM_KEY_ADD_REQ 0x24，44B 载荷
#           已被接受，但实测固件拿到密钥也不做 TX 加密，保留用于逆向）；0 = 关闭。
#
# key_rx_en : 实验开关（默认 0）。装密钥后的 RX 解密声明方式：0 = 收到的帧原样上交
#           （用 /dev/zt9612 dump 抓加密帧）；1 = 剥 16B CCMP/TKIP IV+MIC 并声明
#           DECRYPTED|IV_STRIPPED|MMIC_STRIPPED；2/3 = 只加声明不剥字节的历史臂。
#
# ampdu_en : 实验开关（默认 0=关闭）。A-MPDU 聚合（厂商快路径的第三步）。
#           打开后：声明 IEEE80211_HW_AMPDU_AGGREGATION、TX 缓冲 2KB→16KB、实现 ampdu_action
#           （TX_START 发 MM_BA_ADD_REQ(0x28) 等 CFM 0x29，停止发 MM_BA_DEL_REQ(0x2A)）。
#           **组帧在驱动里做**（2026-09-30 定案）：mac80211 一次只给一个 MPDU，
#           把多个 MPDU 拼进**同一次** bulk 传输才是驱动的活。厂商上传抓包实测：
#           EP5 传输长度 1578/3200/4808 = 1/2/3 个单元，每个非末尾单元占**固定 1608 字节槽位**
#           （下一个 "WLAN" 恒在 +1608），末尾单元才 align8。见 re/REPORT_AMPDU_PUSH.md。
#           **实测状态**：会话能建立 —— `ampdu_action TX_START → BA_ADD_CFM status=0
#           → AMPDU operational`，前提是**同时开 ht_cap_enable=1**，且 bufsz（A）不能为 0
#           （mac80211 在 TX_START 传 0，照发会让固件断言并 USB 掉线；代码已做 A>=64 保护）。
#           **聚合已真正跑通**（2026-10-01，用 tools/inject_large.py 注入满尺寸帧）：
#           8 单元 / 一次传输 12848 字节，实测 **76.32 Mbit/s**（对照单帧路径 7~14）。
#           但**连续聚合会在有限次数后把设备打挂**（bulk OUT -71 → USB 掉线）：
#           agg_max_units=8 崩于第 21 次传输、=3 与 =2 均崩于第 44 次；1 ms 节流
#           （agg_gap_us=1000）无效 ⇒ 崩因未定，疑在传输层（URB 在途请求/节奏），
#           **与聚合格式无关**。⚠️ 旧结论"2 单元必崩 / 首次聚合即掉线"是**伪结论**
#           （那是在 TXQ 一帧都排不出的坏数据面上测的，见 docs/04 D19/D20）。
#           另（r21 定性）：正常单帧路径存在**固件 TX 死锁**（TX status 0 条），
#           与聚合崩溃是两回事 ⇒ **保持 0。**
#
# agg_stride: 实验开关（默认 1608）。聚合时非末尾单元的固定槽位；0 = 紧凑拼接。
#             厂商实测 1608 = 8(WLAN 头) + 28(描述符) + 1572(MPDU 上限)。
# agg_dump : 实验开关（默认 0）。hexdump 前 N 次聚合传输，用于与厂商抓包逐字节对比。
# vendor_tmpl: 实验开关（默认 0）。加密单播数据帧改用厂商**数据帧**描述符模板
#             （+0x02..+0x1b 全部常量，+0x0a=0x1312 等），并把 +0x0E 写成帧自己的
#             802.11 序列号。默认关闭；开启前先读 docs/11 第 8~9 轮。
#
# agg_block: 实验开关（默认 0）。保留 BA 会话但禁止多 MPDU 打包（隔离"会话"与
#            "聚合传输"两个变量；实测该组合完全稳定）。
# agg_max_xfers: 安全阀（默认 1）。最多尝试打包 N 次，之后退回"一次 bulk 一个 MPDU"；
#            0 = 不限。默认 1 是为了避免打包缺陷把设备打成 crash-loop。
# tx_dump : 诊断（默认 0）。打印前 N 个交给设备的 TX 帧（len/fc/prot/mcast/可聚合/序列号）。
# tx_diag : 诊断（默认 0）。打印两条 TX 路径的帧数（legacy= 传统 .tx 路径、txq= TXQ 路径）
#           与聚合计数、txq_wakes/txq_works（r34 新增）。**实测（r34 修正）本内核
#           数据帧走 TXQ 路径**（驱动无 .sta_add ⇒ sta->uploaded=true），
#           legacy 计数只收管理帧/广播/EAPOL。
# agg_min_len: 只有 MPDU >= 此长度才参与聚合（默认 1500）。厂商抓包里每个聚合单元都是
#            1578 字节（MPDU 1550），而实测"把 394/138 字节的小帧打包"必崩 ⇒
#            默认只聚合满尺寸数据帧。设 0 表示不限制（危险，会复现崩溃）。
# agg_max_units: 一次 bulk 最多装几个单元（默认 3 = 厂商抓包的上限）。**实测（r34
#            阶梯终判）**：聚合的崩与单元数无关（3 单元/2 单元均复现）、与速率无关
#            （1.5k/2k pps 均死），死因 = 固件对多单元 bulk 的消费速度逐次衰减
#            （bulk 耗时 113μs→2.7ms 渐涨）直至 -71；**聚合禁用于持续负载**，
#            单帧 2k pps（1,343 帧/s ≈ 16 Mbit/s）是 v0.4 安全上限。
# agg_gap_us: 两次聚合传输之间的最小间隔（微秒，默认 0）。实测加 1 ms 节流**仍**
#            在第 44 次崩 ⇒ **不是"灌太快"**；保留作实验旋钮。
#
# 例：
# options zt9612 do_init=1 do_boot=1 scan_probe=0
#   （行为开关 ht_cap_enable / tx_desc_mask / ntf_log / tx_status / sta_add_en / ampdu_en
#     / tx_staid4b / sta_del_en / vendor_seq_en / key_rx_en / agg_dump / vendor_tmpl
#     / agg_block / tx_dump 默认全为 0；
#     key_en 默认 2（mac80211 软加解密）、sta_add_fmt 默认 7（宽切除载荷，2026-10-04 转正）、
#     sta_reuse 默认 1、tx_staidx 默认 1；agg_stride 默认 1608；agg_max_xfers 默认 1；
#     agg_min_len 默认 1500）

# ----- 查看当前生效值 -------------------------------------------------------
# ls /sys/module/zt9612/parameters/
# cat /sys/module/zt9612/parameters/do_boot

# ----- 调试建议 -------------------------------------------------------------
# 每次实验前: sudo dmesg -C
# 加载后    : sudo dmesg | tail -30
# 结束后    : 直接重启，不要反复 rmmod/insmod
