#
# 安装到 /etc/modprobe.d/zt9612.conf（由 install-driver.sh 参考，不自动覆盖）
#
# 注意：开发/尝鲜阶段请保留 install-driver.sh 写入的
#       /etc/modprobe.d/zt9612-blacklist.conf —— 让本模块只在手动 modprobe 时加载。
#       原因见 README「已知问题」：曾观察到 USB modalias 自动加载后整机失联，
#       根因（注册 wiphy 时漏设父设备）已在 v0.2.0 修复，但这条完整路径尚未复验。

# ----- 模块参数（对应 driver/zt9612.c 的 module_param） ----------------------
#
# do_init : 固件装载完成后是否执行同步 IPC 初始化序列
#           1 = 执行（默认，insmod 全程约 7 秒，其中 MM_START 等约 6.5 秒）
#           0 = 只装载固件，便于分步调试
#
# do_boot : 是否下载固件
#           1 = 下载（默认；要求设备处于"刚上电/刚切模式"的干净 ROM 状态）
#           0 = 复用已经在运行的固件，只做 IPC 初始化（省掉一次拔插）
#
# scan_probe : 扫描时是否主动发送 probe request
#           0 = 只做被动扫描（默认，已验证：iw scan 能列出周围 AP）
#           1 = 每信道发送本驱动自建的广播 probe request（**尚未单独复验**）
#           2 = 逐字节重放厂商抓包里的 probe request（已验证：能收到 probe response）
#           注：1/2 都会跳过 cfg80211 标了 NO_IR/RADAR 的信道
#
# tx_ep : TX bulk-OUT 端点号（默认 5，实验开关，一般不用改）
#
# tx_prep : 切换信道前是否重放厂商的使能序列（SET_IDLE / 0x0104 / SET_FILTER）
#           1 = 重放（默认，与厂商驱动一致）；0 = 不重放（实验对比用）
#
# tx_variant : TX 帧变体实验开关（默认 0）
#           0 = 正常；1 = 描述符 +0x00 置 0；2 = 不带描述符；3 = 补齐到 512 字节
#
# rx_debug : 诊断用（默认 0）。写入 N 后，驱动会记录接下来 N 个**接收** USB 传输
#           的长度（`journalctl -k | grep rxdbg`）。原本用于查"约 1030 字节阈值"，
#           该问题已定案为**驱动 TX 侧**的帧长上限（见 CHANGELOG [0.3.2]）：接收侧正常，
#           下载采样 14095 帧里 98.9% 都 >1030 字节。现在只作 RX 帧长观测用。
#           两个坑：写参数不要用 `echo N | sudo tee`（tee 会吞掉 stdin），
#           读日志用 journalctl -k（kernel.dmesg_restrict=1 时 dmesg 直读为空）。
#
# tx_status : 实验开关（默认 0=关闭）。非 0 时把发送结果上报给 mac80211。
#           实测：上报确实进了速率控制（tx retries 从 18 涨到 6532），但
#           **速率与吞吐都不变**（速率由固件自主决定），因此默认关闭。
#
# tx_status_probe : 开启 tx_status 时，每 N 帧把 1 帧标成"已 ACK"（默认 100），
#           其余如实报失败 —— 因为 USB 写入成功不等于空口被 ACK，不能谎报。
#
# ht_cap_enable : 实验开关（默认 0=关闭）。给 5 GHz band 声明 HT（HT20/SGI、MCS0-15）。
#           **它是 A-MPDU 聚合的前提**：mac80211 的 ieee80211_aggr_check() 在对端链路
#           没有 HT 能力时直接返回（实测 kprobe：不开时 start_tx_ba_session() 永不触发；
#           开了才是 1）。单独声明 HT 不改变实测吞吐。**保持 0。**
#
# tx_desc_mask : 实验开关（默认 0=关闭）。对**加密单播数据帧**按位套用厂商数据帧的
#           描述符字段值（bit1 = `+0x08`）。实测：微基准读数暴涨（×27）但网关收不到帧、
#           DHCP 拿不到地址 ⇒ **默认必须为 0**；微基准读数不等于空口吞吐。
#
# ntf_log : 实验开关（默认 0=关闭）。打印接下来 N 条 EP2-IN 通知内容。
#           实测本设备 interface 0 只有 5 个端点（EP4-IN + EP5-8-OUT），**没有 EP2-IN**，
#           该通道恒为空；代码保留接管逻辑供将来复核。
#
# sta_add_en : 实验开关（默认 0=关闭）。关联完成后给固件发 MM_STA_ADD_REQ(0x0A)，
#           并把 CFM 返回的 sta_idx 写进**加密单播数据帧**的描述符 +0x09
#           （管理帧/广播/EAPOL 仍按"无站点"发）。动机：厂商 Windows 驱动就是这么做的，
#           同链路上传 95.3 Mbit/s，而本驱动 3.7 Mbit/s。
#           **状态（2026-09-27）**：48 字节载荷已实测被固件接受
#           （MM_STA_ADD_CFM → status=0、sta_idx=N；`dmesg | grep STA_ADD_CFM` 可见），
#           链路/DHCP/上网不受影响。但**只带 sta_idx 没带来吞吐提升**
#           （A/B：上传 0.38 vs 0.33 Mbit/s，噪声内）⇒ 默认仍为 0，
#           下一步是聚合（ampdu_action + MM_BA_ADD_REQ）。
#           改载荷任何字节都要"一次一个变量"，并以 0x0B / 0x0600 为判据。
#
# ampdu_en : 实验开关（默认 0=关闭）。A-MPDU 聚合（厂商快路径的第三步）。
#           打开后：声明 IEEE80211_HW_AMPDU_AGGREGATION（**mac80211 自己组 A-MPDU**，
#           驱动拿到的是聚合 skb）、TX 缓冲 2KB→16KB、实现 ampdu_action
#           （TX_START 发 MM_BA_ADD_REQ(0x28) 等 CFM 0x29，停止发 MM_BA_DEL_REQ(0x2A)）。
#           **实测状态**：会话能建立 —— `ampdu_action TX_START → BA_ADD_CFM status=0
#           → AMPDU operational`，前提是**同时开 ht_cap_enable=1**，且 bufsz（A）不能为 0
#           （mac80211 在 TX_START 传 0，照发会让固件断言并 USB 掉线；代码已做 A>=64 保护）。
#           **但压流量时会掉线**：网关 ping 丢包 70%、本地吞吐反降、设备 USB 掉线重连 ——
#           推送路径还吃不下聚合帧（mac80211 交下来的是大 skb，而驱动仍一帧一次 bulk）。
#           排障方向见 re/REPORT_STA_ADD_LAYOUT.md 与 docs/11 第 8 轮记录。**保持 0。**
#
# 例：
# options zt9612 do_init=1 do_boot=1 scan_probe=0
#   （实验开关 ht_cap_enable / tx_desc_mask / ntf_log / tx_status / sta_add_en / ampdu_en 默认全为 0）

# ----- 查看当前生效值 -------------------------------------------------------
# ls /sys/module/zt9612/parameters/
# cat /sys/module/zt9612/parameters/do_boot

# ----- 调试建议 -------------------------------------------------------------
# 每次实验前: sudo dmesg -C
# 加载后    : sudo dmesg | tail -30
# 结束后    : 直接重启，不要反复 rmmod/insmod
