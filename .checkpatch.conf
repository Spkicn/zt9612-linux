# checkpatch.pl 本地运行参数（make checkpatch 与 CI 都会用到）
#
# 用法：
#   driver/ 目录:  make checkpatch
#   无内核树时:    ./checkpatch.pl --no-tree -f --strict --max-line-length=100 driver/zt9612.c
#
# 说明（依据 Documentation/dev-tools/checkpatch.rst）：
#   --no-tree            不依赖完整内核源码树
#   --strict             打开更严格的检查（--max-line-length 在 --file 模式下需要它）
#   --max-line-length=100  内核文档建议单行 ≤ 80 列，checkpatch 默认上限是 100；
#                          本仓库沿用 100，新代码尽量不超过 80~100
--no-tree
--strict
--max-line-length=100

# 存量代码的历史告警暂不阻塞（新代码不应引入新告警）；清理后再逐项放开
--ignore FILE_PATH_CHANGES
--ignore COMMIT_LOG_LONG_LINE
--ignore LINUX_VERSION_CODE
