name: build

# 编译验证。CI 实测结论（见 README「兼容性」）：
#   * ubuntu-24.04 runner（内核 6.17.0-1022-azure）：**零告警编译通过**，产出 zt9612.ko
#   * ubuntu-22.04 runner（内核 6.8.0-1064-azure）：因缺少 linux/unaligned.h 失败
#     —— 该头文件 6.12 才引入，驱动的编译下限就是 6.12（dkms.conf 里已声明）
#   * build-kernel-matrix：对 dkms.conf 声明区间内的 6.12 / 6.14 / 6.16 做**编译取证**
#     （内核 6.12–6.16 不在 24.04 官方源里，从 Ubuntu mainline PPA 取 headers）
#
# 因此：build 作业在 24.04 上**阻塞**；old-kernel 与 kernel-matrix 是信息性对照，
# 用来验证下限/区间声明是否成立，不阻塞合并。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (ubuntu-24.04, blocking)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖与内核头文件
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc
          sudo apt-get install -y "linux-headers-$(uname -r)" \
            || sudo apt-get install -y linux-headers-generic

      - name: 显示环境
        run: |
          uname -a
          gcc --version | head -1
          ls -d /lib/modules/$(uname -r)/build

      - name: 编译模块
        run: make -C driver modules

      - name: 模块信息（license / version / alias / firmware）
        run: |
          modinfo driver/zt9612.ko
          modinfo driver/zt9612.ko | grep -q '^license: *GPL' || { echo "::error::MODULE_LICENSE 不是 GPL"; exit 1; }
          modinfo driver/zt9612.ko | grep -q 'alias:.*350Bp9612' || { echo "::error::MODULE_DEVICE_TABLE 未生效"; exit 1; }

  build-old-kernel:
    name: build (ubuntu-22.04, informational)
    # 对照实验：22.04 runner 的内核低于 6.12 编译下限，预期编译失败。
    # 这里**不判失败**，只在两种结果上给出提示 —— 如果哪天它编译通过了，
    # 说明有人加了兼容层，应该同步更新 dkms.conf 与 README 的下限声明。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建依赖与内核头文件
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc
          sudo apt-get install -y "linux-headers-$(uname -r)" \
            || sudo apt-get install -y linux-headers-generic
      - name: 编译模块（低于 6.12 时预期失败）
        run: |
          echo "runner 内核：$(uname -r)"
          if make -C driver modules; then
            echo "::notice::内核 $(uname -r) 也编译成功了 —— 兼容层可能已加入，请更新 dkms.conf / README 的编译下限声明"
          else
            echo "::notice::预期结果：内核 $(uname -r) 低于编译下限 6.12（缺 linux/unaligned.h）"
          fi

  build-kernel-matrix:
    name: build (kernel ${{ matrix.minor }}, informational)
    # 目的：把 README「未验证区间 6.12–6.16」从"没测过"变成可核对的**编译证据**。
    # 内核 6.12–6.16 不在 Ubuntu 24.04 官方源里，改从 Ubuntu mainline PPA 取 headers deb。
    # 思路来源：aircrack-ng/rtl8812au 的 build.yml 用内核版本驱动矩阵、装 headers 后编译
    # （只借结构，实现是自己写的：按 minor 选最新 patch、从 deb 名反推 KVER/KSRC）。
    # 这一项**不阻塞**：结果写进 job summary，失败打 warning；成功后请同步 README「兼容性」。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minor: ['6.12', '6.14', '6.16']
    steps:
      - uses: actions/checkout@v4

      - name: 取该 minor 最新补丁版的 headers 并安装
        run: |
          set -euo pipefail
          MINOR="${{ matrix.minor }}"
          INDEX="https://kernel.ubuntu.com/~kernel-ppa/mainline/"
          DIR=$(curl -fsSL "$INDEX" | grep -o "v${MINOR}\.[0-9]*/" | sort -V | tail -1)
          test -n "$DIR"
          LIST=$(curl -fsSL "${INDEX}${DIR}")
          # mainline PPA 的链接形如 href="amd64/linux-headers-….deb"，amd64 前缀不能丢
          ALL=$(echo "$LIST" | grep -o 'href="[^"]*_all\.deb"' | head -1 | sed 's/^href="//; s/"$//')
          AMD=$(echo "$LIST" | grep -o 'href="[^"]*_amd64\.deb"' | head -1 | sed 's/^href="//; s/"$//')
          test -n "$ALL" && test -n "$AMD"
          KVER=$(basename "$AMD" | sed 's/^linux-headers-//; s/_.*$//')
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KSRC=/usr/src/linux-headers-$KVER" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/kdebs" && cd "$RUNNER_TEMP/kdebs"
          curl -fsSLO "${INDEX}${DIR}${ALL}"
          curl -fsSLO "${INDEX}${DIR}${AMD}"
          sudo dpkg -i --force-all ./*.deb

      - name: 编译模块
        run: |
          # mainline 的 headers 会沿用构建它时的编译器（6.12.112 是 gcc-15、6.16.12 是 gcc-14），
          # runner 上不一定装了那个版本。策略：先用 headers 默认的编译器，
          # 只有在"编译器找不到"时才退到 runner 自带的 gcc-14；
          # 不要盲目指定 gcc-13 —— 内核配置带 -fmin-function-alignment=16，gcc-13 不认。
          echo "headers: $KSRC"
          try_build() {
            if [ -z "$1" ]; then
              make -C driver KVER="$KVER" KSRC="$KSRC" modules > build.log 2>&1
            else
              make -C driver KVER="$KVER" KSRC="$KSRC" CC="$1" HOSTCC="$1" modules > build.log 2>&1
            fi
          }
          CC_USED="headers 默认编译器"
          if try_build ""; then
            RESULT=PASS
          elif grep -qE "not found|No such file" build.log && command -v gcc-14 >/dev/null; then
            echo "::notice::headers 默认编译器不可用，改用 gcc-14 重试"
            CC_USED="gcc-14（headers 默认编译器缺失）"
            if try_build gcc-14; then RESULT=PASS; else RESULT=FAIL; fi
          else
            RESULT=FAIL
          fi
          tail -25 build.log
          {
            echo "CC_USED=$CC_USED"
            echo "RESULT=$RESULT"
          } >> "$GITHUB_ENV"
          if [ "$RESULT" = PASS ]; then
            echo "::notice::内核 $KVER：编译通过（$CC_USED）"
          else
            echo "::warning::内核 $KVER：编译失败 —— 该版本仍在未验证区间，详见上方日志"
          fi

      - name: 结果写进 job summary
        if: always()
        run: |
          {
            echo "## 内核矩阵：${{ matrix.minor }}"
            echo
            echo "- headers：\`${{ env.KVER }}\`（来源：Ubuntu mainline PPA）"
            echo "- 编译器：${{ env.CC_USED }}"
            echo "- 编译结果：**${{ env.RESULT }}**"
          } >> "$GITHUB_STEP_SUMMARY"
