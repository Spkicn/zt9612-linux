# SPDX-License-Identifier: GPL-2.0-only
# 由 scripts/setup-mode-switch.sh 安装到 /etc/usb_modeswitch.d/350b:f179
# （Windows 文件名不能含冒号，所以仓库里叫 350b-f179.conf）
#
# ZT9612U (ZTOP / 兆通微 ACEV100)：驱动光盘模式 350b:f179 -> 网卡模式 350b:9612
# 也可直接命令行：sudo usb_modeswitch -K -W -v 350b -p f179
TargetVendor=0x350b
TargetProduct=0x9612
StandardEject=1
